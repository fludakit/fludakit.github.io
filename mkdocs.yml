site_name: "FluDa"
site_description: "Fluent Data Toolkit for Jakarta EE and CDI — lightweight, type-safe JDBC queries without Spring."
site_url: https://fludakit.github.io
repo_url: https://github.com/fludakit/fludakit.github.io
repo_name: fludakit/fludakit.github.io

theme:
  name: material
  custom_dir: overrides
  logo: assets/fluda-badge-light.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fludakit

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - redirects:
      redirect_maps:
        'documentation/jdbc-client/getting-started.md': 'https://fludakit.github.io/jdbc-client/getting-started/'
        'documentation/jdbc-client/querying.md': 'https://fludakit.github.io/jdbc-client/querying/'
        'documentation/jdbc-client/updates.md': 'https://fludakit.github.io/jdbc-client/updates/'
        'documentation/sql-init/getting-started.md': 'https://fludakit.github.io/sql-init/getting-started/'
        'documentation/sql-init/version-strategy.md': 'https://fludakit.github.io/sql-init/version-strategy/'
        'documentation/sql-init/resource-resolver.md': 'https://fludakit.github.io/sql-init/resource-resolver/'
        'documentation/tx/getting-started.md': 'https://fludakit.github.io/tx/getting-started/'
        'documentation/tx/jdbc.md': 'https://fludakit.github.io/tx/jdbc/'
        'documentation/tx/jpa.md': 'https://fludakit.github.io/tx/jpa/'
        'documentation/tx/advanced.md': 'https://fludakit.github.io/tx/advanced/'
        'documentation/mail/getting-started.md': 'https://fludakit.github.io/mail/getting-started/'
        'documentation/mail/mail-sender.md': 'https://fludakit.github.io/mail/mail-sender/'
        'documentation/mail/template-resolver.md': 'https://fludakit.github.io/mail/template-resolver/'
        'documentation/data/getting-started.md': 'https://fludakit.github.io/data/getting-started/'
        'documentation/data/ddd.md': 'https://fludakit.github.io/data/ddd/'
        'documentation/data/version.md': 'https://fludakit.github.io/data/version/'
        'documentation/data/domain-events.md': 'https://fludakit.github.io/data/domain-events/'
        'documentation/jms-client/getting-started.md': 'https://fludakit.github.io/jms-client/getting-started/'
        'documentation/jms-client/jakarta-ee.md': 'https://fludakit.github.io/jms-client/jakarta-ee/'
        'documentation/jms-client/message-converter.md': 'https://fludakit.github.io/jms-client/message-converter/'
        'documentation/jms-client/destination-resolver.md': 'https://fludakit.github.io/jms-client/destination-resolver/'

nav:
  - Home: index.md
  - Documentation:
    - Introduction: documentation/introduction.md
    - JDBC Client: documentation/jdbc-client/index.md
    - SQL Init: documentation/sql-init/index.md
    - Transaction: documentation/tx/index.md
    - Mail: documentation/mail/index.md
    - Data: documentation/data/index.md
    - JMS Client: documentation/jms-client/index.md
    - Conditional Beans: documentation/conditional-beans/index.md
  - Blog:
    - blog/index.md


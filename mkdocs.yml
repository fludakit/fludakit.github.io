site_name: "FluDa"
site_description: "Fluent Data Toolkit for Jakarta EE and CDI — lightweight, type-safe JDBC queries without Spring."
site_url: https://fludakit.github.io
repo_url: https://github.com/fludakit/fludakit.github.io
repo_name: fludakit/fludakit.github.io

theme:
  name: material
  custom_dir: overrides
  logo: assets/fluda-badge-light.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fludakit

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false

nav:
  - Home: index.md
  - JDBC Client:
    - Introduction: docs/index.md
    - Installation: docs/install.md
    - Quickstart: docs/quickstart.md
    - Dive deeper:
      - Querying and Result mapping: docs/querying.md
      - Updates and generated keys: docs/updates.md
    - Configuration: docs/configuration.md
  - SQL Init:
    - Introduction: docs/sql-init/index.md
    - Installation: docs/sql-init/install.md
    - Quickstart: docs/sql-init/quickstart.md
    - Configuration: docs/sql-init/configuration.md
  - Blog:
    - blog/index.md


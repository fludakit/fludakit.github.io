site_name: "FluDa"
site_description: "Fluent Data Toolkit for Jakarta EE and CDI — lightweight, type-safe JDBC queries without Spring."
site_url: https://fludakit.github.io
repo_url: https://github.com/fludakit/fludakit.github.io
repo_name: fludakit/fludakit.github.io

theme:
  name: material
  custom_dir: overrides
  logo: assets/fluda-badge-light.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fludakit

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: yyyy-MM-dd
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false

nav:
  - Home: index.md
  - Documentation:
    - Introduction: documentation/introduction.md
    - JDBC Client:
      - Introduction: documentation/jdbc-client/index.md
      - Getting Started: documentation/jdbc-client/getting-started.md
      - Dive deeper:
        - Querying and Result mapping: documentation/jdbc-client/querying.md
        - Updates and generated keys: documentation/jdbc-client/updates.md
    - SQL Init:
      - Introduction: documentation/sql-init/index.md
      - Getting Started: documentation/sql-init/getting-started.md
      - Version Strategy: documentation/sql-init/version-strategy.md
      - Resource Resolver: documentation/sql-init/resource-resolver.md
    - Transaction:
      - Introduction: documentation/tx/index.md
      - Getting Started: documentation/tx/getting-started.md
      - JDBC Implementation: documentation/tx/jdbc.md
      - JPA Implementation: documentation/tx/jpa.md
      - Mixing JDBC and JPA: documentation/tx/advanced.md
    - Mail:
      - Introduction: documentation/mail/index.md
      - Getting Started: documentation/mail/getting-started.md
      - Mail Sender: documentation/mail/mail-sender.md
      - Template Resolver: documentation/mail/template-resolver.md
    - Data:
      - Introduction: documentation/data/index.md
      - Getting Started: documentation/data/getting-started.md
      - Applying DDD: documentation/data/ddd.md
      - Optimistic Locking: documentation/data/version.md
      - Domain Events: documentation/data/domain-events.md
    - JMS Client:
      - Introduction: documentation/jms-client/index.md
      - Getting Started: documentation/jms-client/getting-started.md
      - Jakarta EE: documentation/jms-client/jakarta-ee.md
      - Message Converter: documentation/jms-client/message-converter.md
      - Destination Resolver: documentation/jms-client/destination-resolver.md
  - Blog:
    - blog/index.md

